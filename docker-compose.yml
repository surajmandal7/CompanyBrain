services:
  companybrain:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5));
          raise SystemExit(0 if data.get('status') == 'ok' else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
